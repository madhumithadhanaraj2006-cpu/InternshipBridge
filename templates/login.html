<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | InternshipBridge</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #123b63;
        }

        header {
            background: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #ddd;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .logo span {
            color: #12b886;
        }

        .home-btn {
            padding: 10px 20px;
            border: 1px solid #123b63;
            border-radius: 6px;
            text-decoration: none;
            color: #123b63;
            background: white;
        }

        main {
            min-height: 650px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #dce3ea;
        }

        h1 {
            margin-top: 0;
            font-size: 34px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #60758d;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #123f6b;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #123f6b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d3154;
        }

        .message {
            background: #ffe8e8;
            color: #b42318;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .admin-info {
            margin-top: 25px;
            padding: 15px;
            background: #eef7fc;
            border-radius: 8px;
            font-size: 14px;
            color: #55718d;
        }

        .admin-info strong {
            color: #123b63;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        Internship<span>Bridge</span>
    </div>

    <a href="/" class="home-btn">
        ← Home
    </a>

</header>


<main>

    <div class="login-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your InternshipBridge account
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form action="/login" method="POST">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="admin-info">

            <strong>Demo Admin Login</strong>

            <br><br>

            Email:
            admin@gmail.com

            <br>

            Password:
            admin123

        </div>

    </div>

</main>

</body>

</html>
